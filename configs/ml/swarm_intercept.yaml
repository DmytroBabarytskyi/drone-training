# SwarmInterceptEnv: planar density-control task for N interceptor drones.
# See src/dronesim/ml/swarm/swarm_env.py for what each field controls.

# Scene parameters are sized so the task is actually winnable — an earlier
# configuration (9 drones, 2 m kill radius, 3 cueing samples, targets crossing
# outside the reachable area) had a theoretical ceiling of ~10% hit rate no
# matter how good the policy was. See docs/swarm_intercept_eval.md.
scene:
  # Drones needed scales as (prediction sigma / kill radius)^2. With the
  # cueing below giving sigma ~4.6 m and a 3 m kill radius, covering +/-2
  # sigma needs ~9 drones; 25 gives margin for imperfect placement.
  n_drones: 25
  # The mesh holds a WIDE sector sparsely and must concentrate to intercept —
  # that is the whole concept being tested. Spacing is far larger than the
  # kill radius (3 m), so the resting lattice covers only ~14% of the sector:
  # standing still is not a solution, concentrating is. An earlier
  # configuration packed the lattice tightly enough that doing nothing already
  # scored 63%, which made the learned policy unfalsifiable.
  #
  # Sector size is not free: a drone must physically reach the formation
  # inside the engagement window. With max_speed 25 m/s, max_accel 15 m/s^2
  # and a 4 s window the reach is ~79 m, and the worst-case transit is
  # sqrt(2)*(coverage_half_extent + crossing_area_half_extent). At 35 and 20
  # that is 77.8 m — just inside reach. Widening the sector past this makes
  # the far drones arrive late no matter how good the policy is (measured:
  # at 60/45 the mean slot was left 3.3 m unfilled, larger than the kill
  # radius, capping the achievable hit rate).
  grid_spacing_m: 15.0
  coverage_half_extent_m: 35.0
  min_separation_m: 2.5
  hit_radius_m: 3.0        # small warhead's lethal radius, not a contact hit
  # Racing-FPV class performance — needed to cross the sector inside the
  # engagement window once cueing arrives.
  max_speed_mps: 25.0
  max_accel_mps2: 15.0
  dt_s: 0.1
  decision_steps: 40

  plane_x_m: 0.0
  target_speed_range_mps: [100.0, 160.0]
  target_start_distance_range_m: [400.0, 700.0]
  # Must stay <= coverage_half_extent_m, or some episodes are unwinnable by
  # construction: the target crosses where no drone is allowed to fly.
  crossing_area_half_extent_m: 20.0
  # A tracking radar produces a stream of fixes, not three pings — and
  # prediction quality dominates everything downstream, so this is where the
  # cheap wins are.
  n_cueing_samples: 8
  cueing_interval_s: 0.4
  sensor_noise_std_m: 4.0

reward:
  cluster_scale: 8.0
  collision_penalty: 5.0
  out_of_bounds_penalty: 1.0
  time_penalty: 0.01
  hit_bonus_per_drone: 50.0
  hit_saturation_count: 3
  miss_penalty: 100.0
