# DroneEnv (фаза 6): навігація до цілі поверх PosHoldController.
vehicle_config: vehicles/quad_large
physics_hz: 240.0
decision_substeps: 12    # 240/12 = 20Hz частота рішень агента
max_episode_steps: 300   # 300 * (12/240с) = 15с на епізод

# Ціль розставляється випадково (детерміновано за seed reset()) навколо (0,0,*).
target_radius_range: [10.0, 25.0]
target_altitude_range: [2.0, 8.0]
# Старт апарата — випадково НАВКОЛО цілі (не в тій самій точці щоразу).
start_radius_range: [8.0, 18.0]
start_altitude_range: [-2.0, 2.0]

reward:
  progress_scale: 10.0
  los_bonus: 0.05
  max_aim_angle_rad: 0.6
  hit_radius: 2.0
  hit_bonus: 100.0
  crash_penalty: -50.0
  out_of_bounds_penalty: -50.0
  out_of_bounds_radius: 60.0
  time_penalty: -0.01
  min_altitude: 0.3
