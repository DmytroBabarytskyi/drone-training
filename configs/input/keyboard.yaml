# Клавіатурне керування через події Panda3D. WASD — тангаж/крен, Q/E — рискання,
# Shift/Ctrl — газ вгору/вниз, Space — arm/disarm.
#
# "Віртуальний стік": утримання клавіші плавно розганяє вісь до ±1, відпускання —
# плавно повертає до 0 (клавіатура цифрова, а стік — аналоговий; без цього
# політ був би смикано-різким). ramp_per_second — швидкість наростання осі
# крену/тангажу/рискання, одиниць/с; час до повного відхилення ≈ 1/ramp.
# expo=0.0 (лінійний ввід, доп. фаза "справжній Liftoff") — реальна крива
# BetaFlight Actual Rates тепер повністю в rate_profile апарата
# (vehicles/controllers/rates.py), як і в реальному BetaFlight (TX
# лінійний, крива — у польотному контролері). Подвійна крива (вхід+апарат)
# відчувалась би розмазано.
#
# ЗНИЖЕНО (реальний фідбек користувача: "дуже різко змінюється при WASD" і
# "дуже швидко збільшується/зменшується швидкість при Shift/Ctrl"): ramp
# для нахилу 2.5 -> 1.5 (повне відхилення за ~0.67с замість 0.4с), а газ
# отримав ОКРЕМИЙ, значно повільніший ramp — реальний важіль газу не
# стрибає з 0 до 100% за пів секунди. throttle_ramp_per_second діє на
# внутрішню вісь газу в діапазоні [-1..1] (повний хід 0->100% ≈ 2/ramp с).
ramp_per_second: 1.5
throttle_ramp_per_second: 0.7
expo: 0.0

bindings:
  pitch_forward: w
  pitch_back: s
  roll_left: a
  roll_right: d
  yaw_left: q
  yaw_right: e
  throttle_up: shift
  throttle_down: control
  arm_toggle: space
  mode_cycle: tab   # перемикання Acro -> Angle -> Alt-hold -> Pos-hold -> ...
