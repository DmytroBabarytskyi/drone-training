# Полігон: навести апарат на віртуальну ціль і "влучити" (зближення+кут прицілювання).
# max_aim_angle_deg — допустиме відхилення напрямку носа апарата від напрямку на ціль.
#
# pos.z=3 — ЦЕНТР хіт-сфери (radius 3.0), а НЕ висота, на якій висить модель:
# техніка/артилерія малюється в НИЗУ сфери (base_z = max(0, 3-3) = 0, тобто НА
# ЗЕМЛІ — app.py::_sync_target_markers, реальний фідбек "танк літає у повітрі"),
# а сфера радіусом 3 навколо центру на 3м повністю охоплює наземний силует
# (0..1.5м) — прицілювання по видимій техніці зараховується. Хіт-ЦЕНТР лишено
# на 3м (НЕ опущено до землі!), бо автономна RL-політика навчена на цілях у
# повітрі (ml/rl_strike.yaml) — опускання центру нижче ~3м виводить її з
# розподілу й вона осідає в землю (регрес, тест test_app_autonomous.py).
max_aim_angle_deg: 20.0
time_limit_s: 120.0
targets:
  - { pos: [20.0, 0.0, 3.0], radius: 3.0, kind: vehicle }
  - { pos: [0.0, 20.0, 3.0], radius: 3.0, kind: artillery }
  - { pos: [-15.0, 10.0, 3.0], radius: 3.0, kind: vehicle }
  - { pos: [10.0, -15.0, 3.0], radius: 3.0, moves_to: [16.0, -8.0, 3.0], period_s: 10.0, kind: vehicle }
