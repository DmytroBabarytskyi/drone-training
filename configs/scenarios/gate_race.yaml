# Рейс крізь ворота "діамантом" — 4 ворота в кардинальних точках, normal кожних
# воріт вказує РАДІАЛЬНО НАЗОВНІ (напрямок прольоту крізь ворота від центру).
# Проліт за порядком (0,1,2,3) замикає коло.
laps_to_win: 3
gates:
  - { center: [15.0, 0.0, 3.0], normal: [1.0, 0.0, 0.0], radius: 3.0 }
  - { center: [0.0, 15.0, 3.0], normal: [0.0, 1.0, 0.0], radius: 3.0 }
  - { center: [-15.0, 0.0, 3.0], normal: [-1.0, 0.0, 0.0], radius: 3.0 }
  - { center: [0.0, -15.0, 3.0], normal: [0.0, -1.0, 0.0], radius: 3.0 }
