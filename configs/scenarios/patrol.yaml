# Патруль: цілі з'являються за розкладом (t_spawn), апарат має пролетіти
# достатньо близько (radius), щоб "помітити" ціль (лише дистанція, без кута
# прицілювання — патруль про виявлення, не про ураження).
duration_s: 60.0
spawns:
  - { t_spawn: 2.0, pos: [10.0, 5.0, 3.0], radius: 3.0 }
  - { t_spawn: 15.0, pos: [-8.0, 12.0, 3.0], radius: 3.0 }
  - { t_spawn: 30.0, pos: [5.0, -10.0, 3.0], radius: 3.0 }
