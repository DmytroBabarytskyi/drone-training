# Великий мультиротор — важкий, повільний, для "розумних" режимів (фаза 3):
# Angle/Alt-hold/Pos-hold. Той самий X-мультиротор, що й fpv_5inch (vehicles/
# multirotor.py), лише параметри інші. Значення — стартові орієнтири; тюнинг
# ітеративно на scripts/hover_test.py та tests/.
name: quad_large
mass: 5.0             # кг
arm_length: 0.35      # м (від центру до мотора)
body_half_extent: [0.15, 0.15, 0.06]  # м, half-extent коробки корпусу для колізій
inertia: [0.15, 0.15, 0.25]  # Ixx, Iyy, Izz кг·м²
max_thrust_per_motor: 30.0   # Н (~2.45x перевищує вагу на завису — не акробатика)
thrust_to_torque: 0.02
drag_coeff: [0.30, 0.30, 0.55]  # анізотропний квадратичний опір, X/Y/Z тіла (доп. фаза "реалізм фізики")
motor_count: 4

# Доп. фаза "реалізм фізики" — опційні параметри (відсутність = вимкнено):
motor_tau_s: 0.12            # важчий гвинт/мотор -> повільніший відгук за fpv_5inch
rotor_radius_m: 0.2032       # ~16" гвинт -> R≈0.2м, для екранного ефекту (IGE)
battery_full_throttle_s: 300  # орієнтовно ~5хв на повному газі до розряду
battery_sag_coeff: 0.08       # більша батарея -> менший відносний internal resistance sag
airmode: true                 # зберігає авторитетність нахилу на малому газі (не обрізає корекції)

# PID rate-loop (внутрішній контур, спільний з Acro через RateLoopMixer).
pid_rate:
  roll:  { kp: 0.02, ki: 0.02, kd: 0.0005, i_limit: 0.5 }
  pitch: { kp: 0.02, ki: 0.02, kd: 0.0005, i_limit: 0.5 }
  yaw:   { kp: 0.03, ki: 0.03, kd: 0.0,    i_limit: 0.3 }

# Значно повільніші rate, ніж у fpv_5inch — не акробатичний апарат.
max_rates: { roll: 60, pitch: 60, yaw: 30 }

# Angle/Self-level: зовнішній контур "кут -> бажана кутова швидкість".
pid_angle:
  roll:  { kp: 4.0, ki: 0.5, kd: 0.05, i_limit: 0.5 }
  pitch: { kp: 4.0, ki: 0.5, kd: 0.05, i_limit: 0.5 }
max_angle_deg: 25   # максимальний кут нахилу при повному відхиленні стіка

# Alt-hold: один PID-контур "похибка висоти -> корекція нормованої команди мотора".
pid_altitude: { kp: 0.15, ki: 0.05, kd: 0.25, i_limit: 0.3 }
max_climb_rate_mps: 3.0   # швидкість зміни цільової висоти при повному відхиленні стіка газу

# Pos-hold: каскад "похибка позиції (м) -> бажана швидкість (м/с)" ->
# "похибка швидкості -> цільовий кут нахилу".
pid_position: { kp: 0.6, ki: 0.0, kd: 0.1, i_limit: 1.0 }
pid_velocity: { kp: 0.15, ki: 0.02, kd: 0.02, i_limit: 0.3 }
max_horizontal_speed_mps: 4.0   # макс. швидкість при ручному керуванні стіком у Pos-hold
