# 5-дюймовий FPV-фрістайл квадрокоптер (як типовий апарат у Liftoff).
# Значення — стартові орієнтири; тюнинг на scripts/hover_test.py (фаза 1-2).
name: fpv_5inch
mass: 0.55            # кг (з батареєю)
arm_length: 0.11      # м (від центру до мотора)
body_half_extent: [0.04, 0.04, 0.02]  # м, half-extent коробки корпусу для колізій (без рук/пропелерів)
inertia: [0.0023, 0.0023, 0.004]  # Ixx, Iyy, Izz кг·м²
max_thrust_per_motor: 9.0         # Н (сумарно ~4x перевищує вагу — акробатика)
thrust_to_torque: 0.016           # коеф. реактивного моменту
drag_coeff: [0.06, 0.06, 0.11]    # анізотропний квадратичний опір, X/Y/Z тіла (доп. фаза "реалізм фізики")
motor_count: 4

# Доп. фаза "реалізм фізики" — опційні параметри (відсутність = вимкнено):
motor_tau_s: 0.03           # стала часу розкрутки мотора (легкий гвинт -> швидкий відгук)
rotor_radius_m: 0.0635      # 5" гвинт -> R=0.0635м, для екранного ефекту (IGE)
battery_full_throttle_s: 240  # орієнтовно ~4хв на повному газі до розряду (типовий гоночний LiPo)
battery_sag_coeff: 0.12       # миттєве просідання тяги під повним газом (~12%)
airmode: true                 # зберігає авторитетність нахилу на малому газі (не обрізає корекції)
# rate_feedforward НЕ увімкнено тут (доступно/протестовано, tests/test_rate_loop.py)
# — потребує живого підбору gain під конкретне відчуття стіка; вмикати
# необережно ризикує повторити "вилітаю як ракета" (docs/DECISIONS.md).

# PID rate-loop (Acro). Тюнити ітеративно. i_limit — межа інтегральної складової
# (анти-віндап, utils/pid.py) у тих самих одиницях, що й вихід PID.
# d_filter_alpha (доп. фаза "реалізм фізики"): LPF на D-складову (0..1, 1.0 =
# без фільтра/стара поведінка) — реальні FC завжди фільтрують похідну, інакше
# шум/стрибки виміру підсилюються в "кік". Помірне 0.6 — компроміс: гасить
# зайве тремтіння без відчутної затримки відгуку.
# kd roll/pitch retuned 0.00003 -> 0.0001 (доп. фаза "реалізм фізики"): перехід
# rate-loop на похідну-від-виміру (не від похибки, utils/pid.py) трохи ослабив
# демпфування каскаду Angle (емпірично: залишковий крен після відпускання
# стіка зріс з ~0.75° до ~3.1° при старому kd) — компенсовано підбором kd
# (перебір 3e-5..2e-4 headless, tests/test_angle_controller.py), не тільки
# теоретично: 0.0001 повертає залишок до ~2.4° (запас під поріг тесту 3.0°).
pid_rate:
  roll:  { kp: 0.0016, ki: 0.003, kd: 0.0001, i_limit: 0.5, d_filter_alpha: 0.6 }
  pitch: { kp: 0.0016, ki: 0.003, kd: 0.0001, i_limit: 0.5, d_filter_alpha: 0.6 }
  yaw:   { kp: 0.0032, ki: 0.005, kd: 0.0,    i_limit: 0.3, d_filter_alpha: 0.6 }

# Rate-профіль Acro (доп. фаза "справжній Liftoff") — РЕАЛЬНА формула
# BetaFlight "Actual Rates" (vehicles/controllers/rates.py), не спрощений
# stick*max_rate. center_sensitivity_deg_s — швидкість біля центру стіка,
# max_rate_deg_s — при повному відхиленні, expo — форма кривої між ними
# (0=лінійно, 1=максимально м'яко в центрі). ПОМІРНІ значення (не "гонкові"
# 670+ deg/s) — навмисно: клавіатура/новачок тримають стік на повному
# відхиленні набагато довше за реальний аналоговий палець (тонких корекцій
# немає), тож "гонкові" rates відчувались як миттєва втрата контролю
# (реальний фідбек користувача — "вилітаю як ракета"). Ближче до типових
# "smooth/cinematic" пресетів реальних пілотів, не гонкових.
rate_profile:
  roll:  { center_sensitivity_deg_s: 120, max_rate_deg_s: 380, expo: 0.25 }
  pitch: { center_sensitivity_deg_s: 120, max_rate_deg_s: 380, expo: 0.25 }
  yaw:   { center_sensitivity_deg_s: 100, max_rate_deg_s: 280, expo: 0.30 }

# Angle/Self-level (доп. фаза "справжній Liftoff") — стартовий режим за
# замовчуванням (app.py вибирає Angle, якщо апарат його підтримує):
# відпустив стік -> апарат сам вирівнюється в горизонт, набагато
# стабільніше перше знайомство з керуванням за Acro (де апарат ПРОДОВЖУЄ
# обертання, доки не скоригуєш). Acro лишається доступним через Tab —
# для фрістайлу. Гейни підібрані емпірично (не перенесені з quad_large —
# та ж кутова швидкість тілту дає зовсім інший відгук на 13x легшому
# апараті): kp=6/kd=0.05 давав перерегулювання до 59° (замість 40°) і
# коливання ±23° після відпускання стіка — недостатньо демпфування для
# настільки маневреного апарата. kp=2.0/kd=0.8 дає плавний вихід на ~38°
# і затухання до <1° коливань після відпускання (перевірено емпірично).
pid_angle:
  roll:  { kp: 2.0, ki: 0.1, kd: 0.8, i_limit: 0.5 }
  pitch: { kp: 2.0, ki: 0.1, kd: 0.8, i_limit: 0.5 }
max_angle_deg: 40   # максимальний кут нахилу при повному відхиленні стіка
